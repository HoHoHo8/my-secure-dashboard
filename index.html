<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoHoHo | REAL-TIME MARKET INTELLIGENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
        .card-bg { background-color: #131b2e; border: 1px solid #1e293b; }
        .sidebar-bg { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .nav-btn { transition: all 0.2s; border-left: 4px solid transparent; }
        .nav-btn.active { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border-left-color: #3b82f6; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 🔒 登入 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50">
        <form onsubmit="handleLogin(event)" class="card-bg p-8 rounded-2xl w-96 border border-slate-700 shadow-2xl text-center space-y-4">
            <div class="bg-blue-600 text-white font-black text-xl px-3 py-1.5 rounded-lg inline-block mb-2">HoHoHo</div>
            <h3 class="text-lg font-bold text-white">請先登入系統</h3>
            <input type="password" id="login-pass" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <p id="login-error" class="text-xs text-rose-400 hidden">❌ 密碼錯誤，請重新輸入</p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-bold transition">登入系統</button>
        </form>
    </div>

    <!-- 左側邊欄 -->
    <aside class="w-64 sidebar-bg flex-shrink-0 hidden md:flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 px-2 py-3 mb-4">
                <div class="bg-blue-600 text-white font-black text-lg px-2.5 py-1 rounded">HoHoHo</div>
                <div class="text-[10px] text-slate-400 font-bold tracking-widest">GLOBAL MARKETS</div>
            </div>

            <nav class="space-y-1 text-xs">
                <button onclick="switchTab('tab-overview')" id="btn-tab-overview" class="nav-btn active w-full flex items-center gap-3 px-3 py-2.5 rounded text-slate-300">
                    <i class="fa-solid fa-gauge-high w-4"></i> 市場脈搏總覽
                </button>
                <button onclick="switchTab('tab-watchlist')" id="btn-tab-watchlist" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded text-slate-400 hover:text-white">
                    <i class="fa-solid fa-star w-4"></i> ⭐ 自選股與趨勢圖表
                </button>
            </nav>
        </div>

        <div class="border-t border-slate-800 pt-4 px-2 text-xs">
            <button onclick="handleLogout()" class="text-slate-500 hover:text-rose-400 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出系統
            </button>
        </div>
    </aside>

    <!-- 主內容區 -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 border-b border-slate-800 px-6 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-emerald-400 font-bold">HoHoHo 真實行情連線中 (HK / US)</span>
                <span class="text-slate-500" id="last-update-time">載入中...</span>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                <i class="fa-solid fa-rotate mr-1"></i> 重新整理
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">

            <!-- 1. 市場脈搏總覽 -->
            <section id="tab-overview" class="tab-content active space-y-6">
                <div class="card-bg p-5 rounded-xl space-y-4">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-globe text-blue-500"></i> 港美核心指數真實行情 (Yahoo API)
                    </h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <span class="text-slate-400">🇭🇰 恒生指數 (HSI)</span>
                            <p class="text-lg font-bold text-white mt-1" id="hsi-price">載入中...</p>
                            <span class="text-xs" id="hsi-change">--</span>
                        </div>
                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <span class="text-slate-400">🇭🇰 恒生科技指數</span>
                            <p class="text-lg font-bold text-white mt-1" id="hstech-price">載入中...</p>
                            <span class="text-xs" id="hstech-change">--</span>
                        </div>
                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <span class="text-slate-400">🇺🇸 標普 500 (S&P500)</span>
                            <p class="text-lg font-bold text-white mt-1" id="sp500-price">載入中...</p>
                            <span class="text-xs" id="sp500-change">--</span>
                        </div>
                        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <span class="text-slate-400">🇺🇸 納斯達克 (Nasdaq)</span>
                            <p class="text-lg font-bold text-white mt-1" id="nasdaq-price">載入中...</p>
                            <span class="text-xs" id="nasdaq-change">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. 自選股與圖表 -->
            <section id="tab-watchlist" class="tab-content space-y-6">
                <div class="card-bg p-5 rounded-xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-chart-line text-blue-500"></i> 個股歷史 K 線趨勢圖
                        </h3>
                        <span class="text-xs text-blue-400 font-bold" id="selected-stock-title">點擊下方股票顯示真實歷史圖表</span>
                    </div>
                    <div class="h-64 relative">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>

                <div class="card-bg p-5 rounded-xl space-y-4">
                    <h3 class="text-sm font-bold text-white">⭐ 我的自選追蹤清單 (真實數據)</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-900 text-slate-400">
                                <tr>
                                    <th class="p-3">代號</th>
                                    <th class="p-3">股票名稱</th>
                                    <th class="p-3">最新價格</th>
                                    <th class="p-3">今日漲跌幅</th>
                                </tr>
                            </thead>
                            <tbody id="watchlist-body" class="divide-y divide-slate-800">
                                <!-- 真實數據注入 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        let myChart = null;
        let globalWatchlist = [];

        function checkAuth() {
            const isAuth = localStorage.getItem('tw_pulse_auth');
            const modal = document.getElementById('login-modal');
            if (modal) {
                if (isAuth === 'true') modal.classList.add('hidden');
                else modal.classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            if (e) e.preventDefault();
            if (document.getElementById('login-pass').value.trim() === 'admin123') {
                localStorage.setItem('tw_pulse_auth', 'true');
                checkAuth();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('tw_pulse_auth');
            checkAuth();
        }

        checkAuth();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        function renderChart(stock) {
            document.getElementById('selected-stock-title').innerText = `${stock.name} (${stock.code}) 歷史走勢`;
            const ctx = document.getElementById('stockChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: stock.history_dates || [],
                    datasets: [{
                        label: `${stock.code} 價格`,
                        data: stock.history_prices || [],
                        borderColor: stock.is_up ? '#10b981' : '#f43f5e',
                        backgroundColor: stock.is_up ? 'rgba(16, 185, 129, 0.1)' : 'rgba(244, 63, 94, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }

        function updateIndexUI(id, data) {
            if(!data) return;
            const priceEl = document.getElementById(`${id}-price`);
            const changeEl = document.getElementById(`${id}-change`);
            if(priceEl) priceEl.innerText = '$' + data.price;
            if(changeEl) {
                changeEl.innerText = data.change;
                changeEl.className = `text-xs font-bold ${data.is_up ? 'text-emerald-400' : 'text-rose-400'}`;
            }
        }

        // 從 Python 生成的 data.json 讀取 100% 真實數據
        fetch('./data.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if(data.last_updated) {
                    document.getElementById('last-update-time').innerText = '最後抓取時間: ' + data.last_updated;
                }

                // 1. 渲染真實指數
                if(data.indices) {
                    updateIndexUI('hsi', data.indices.hsi);
                    updateIndexUI('hstech', data.indices.hstech);
                    updateIndexUI('sp500', data.indices.sp500);
                    updateIndexUI('nasdaq', data.indices.nasdaq);
                }

                // 2. 渲染真實自選股
                if(data.watchlist && data.watchlist.length > 0) {
                    globalWatchlist = data.watchlist;
                    const tbody = document.getElementById('watchlist-body');
                    tbody.innerHTML = globalWatchlist.map((item, idx) => `
                        <tr class="hover:bg-slate-900/50 cursor-pointer transition" onclick="renderChart(globalWatchlist[${idx}])">
                            <td class="p-3 font-bold text-blue-400">${item.code}</td>
                            <td class="p-3 text-slate-200">${item.name}</td>
                            <td class="p-3 font-mono font-bold text-white">$${item.price}</td>
                            <td class="p-3 font-mono font-bold ${item.is_up ? 'text-emerald-400' : 'text-rose-400'}">${item.change}</td>
                        </tr>
                    `).join('');

                    // 預設畫第一隻股票圖表
                    renderChart(globalWatchlist[0]);
                }
            })
            .catch(err => console.error("Data load error:", err));
    </script>
</body>
</html>
