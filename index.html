<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoHoHo | GLOBAL MARKET INTELLIGENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
        .card-bg { background-color: #131b2e; border: 1px solid #1e293b; }
        .sidebar-bg { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .nav-btn { transition: all 0.2s; border-left: 4px solid transparent; }
        .nav-btn.active { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border-left-color: #3b82f6; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 🔒 登入 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50">
        <form onsubmit="handleLogin(event)" class="card-bg p-8 rounded-2xl w-96 border border-slate-700 shadow-2xl text-center space-y-4">
            <div class="bg-blue-600 text-white font-black text-xl px-3 py-1.5 rounded-lg inline-block mb-2">HoHoHo</div>
            <h3 class="text-lg font-bold text-white">請先登入系統</h3>
            <p class="text-xs text-slate-400">請輸入管理員密碼以存取機構級數據儀表板</p>
            <input type="password" id="login-pass" placeholder="HoHoHo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <p id="login-error" class="text-xs text-rose-400 hidden">❌ </p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-bold transition">登入系統</button>
        </form>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 sidebar-bg flex-shrink-0 hidden md:flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 px-2 py-3 mb-4">
                <div class="bg-blue-600 text-white font-black text-lg px-2.5 py-1 rounded">TW Pulse</div>
                <div class="text-[10px] text-slate-400 font-bold tracking-widest">GLOBAL MARKETS</div>
            </div>
            <nav class="space-y-1 text-xs">
                <button onclick="switchTab('tab-watchlist')" id="btn-tab-watchlist" class="nav-btn active w-full flex items-center gap-3 px-3 py-2.5 rounded text-slate-300">
                    <i class="fa-solid fa-star w-4"></i> ⭐ 自選股與趨勢圖表
                </button>
            </nav>
        </div>
        <div class="border-t border-slate-800 pt-4 px-2 text-xs">
            <button onclick="handleLogout()" class="text-slate-500 hover:text-rose-400 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出系統
            </button>
        </div>
    </aside>

    <!-- 主區域 -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 border-b border-slate-800 px-6 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-3 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-emerald-400 font-bold">全球數據連線正常 (HK / US)</span>
                <span class="text-slate-500" id="last-update-time">更新中...</span>
            </div>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                <i class="fa-solid fa-rotate mr-1"></i> 重新整理
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">
            
            <section id="tab-watchlist" class="tab-content active space-y-6">
                
                <!-- 📈 動態圖表展示區塊 -->
                <div class="card-bg p-5 rounded-xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-chart-line text-blue-500"></i> 個股近 30 日歷史走勢圖
                        </h3>
                        <span class="text-xs text-blue-400 font-bold" id="selected-stock-title">點擊下方股票查看圖表</span>
                    </div>
                    <div class="h-64 relative">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>

                <!-- 📋 自選股清單與新增控制區 -->
                <div class="card-bg p-5 rounded-xl space-y-4">
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <h3 class="text-sm font-bold text-white">⭐ 我的自選追蹤清單</h3>
                        <div class="flex gap-2 w-full md:w-auto">
                            <input type="text" id="watch-input-code" placeholder="代號 (如: 0939.HK, AAPL)" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                            <input type="text" id="watch-input-name" placeholder="股票名稱 (選填)" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                            <button onclick="addWatchlist()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-xs font-bold transition whitespace-nowrap">
                                + 加入追蹤
                            </button>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-900 text-slate-400">
                                <tr>
                                    <th class="p-3">代號</th>
                                    <th class="p-3">股票名稱</th>
                                    <th class="p-3">最新價格</th>
                                    <th class="p-3">今日漲跌幅</th>
                                    <th class="p-3">互動操作</th>
                                </tr>
                            </thead>
                            <tbody id="watchlist-body" class="divide-y divide-slate-800">
                                <!-- JS 動態填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        let myChart = null;
        let globalStockData = [];

        // Auth 檢查
        function checkAuth() {
            const isAuth = localStorage.getItem('tw_pulse_auth');
            const modal = document.getElementById('login-modal');
            if (modal) {
                if (isAuth === 'true') modal.classList.add('hidden');
                else modal.classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            if (e) e.preventDefault();
            const pass = document.getElementById('login-pass').value.trim();
            if (pass === 'admin123') {
                localStorage.setItem('tw_pulse_auth', 'true');
                checkAuth();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            if (confirm('確定要登出嗎？')) {
                localStorage.removeItem('tw_pulse_auth');
                checkAuth();
            }
        }

        checkAuth();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        // 📊 渲染走勢圖表 (Chart.js)
        function renderStockChart(stock) {
            document.getElementById('selected-stock-title').innerText = `${stock.name} (${stock.code}) 走勢圖`;
            const ctx = document.getElementById('stockChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: stock.history_dates,
                    datasets: [{
                        label: `${stock.code} 股價 ($)`,
                        data: stock.history_prices,
                        borderColor: stock.is_up ? '#10b981' : '#f43f5e',
                        backgroundColor: stock.is_up ? 'rgba(16, 185, 129, 0.1)' : 'rgba(244, 63, 94, 0.1)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }

        // 📋 渲染自選股表格
        function renderWatchlistTable(stocks) {
            const tbody = document.getElementById('watchlist-body');
            if(!tbody) return;

            tbody.innerHTML = stocks.map((item, idx) => `
                <tr class="hover:bg-slate-900/50 cursor-pointer transition" onclick="selectStock(${idx})">
                    <td class="p-3 font-bold text-blue-400">${item.code}</td>
                    <td class="p-3 text-slate-200">${item.name}</td>
                    <td class="p-3 font-mono font-bold text-white">$${item.price}</td>
                    <td class="p-3 font-mono font-bold ${item.is_up ? 'text-emerald-400' : 'text-rose-400'}">${item.change}</td>
                    <td class="p-3">
                        <button onclick="event.stopPropagation(); removeWatchlist('${item.code}')" class="text-xs bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800/50 px-2.5 py-1 rounded transition">
                            <i class="fa-solid fa-trash-can mr-1"></i>刪除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function selectStock(idx) {
            if(globalStockData[idx]) renderStockChart(globalStockData[idx]);
        }

        // ➕ 真實加入股票
        function addWatchlist() {
            const code = document.getElementById('watch-input-code').value.trim().toUpperCase();
            const name = document.getElementById('watch-input-name').value.trim() || code;

            if(!code) return alert("請輸入股票代號！");

            let currentList = JSON.parse(localStorage.getItem('my_watchlist') || '[]');
            if(currentList.some(s => s.code === code)) return alert("該股票已在自選清單中！");

            currentList.push({ code, name });
            localStorage.setItem('my_watchlist', JSON.stringify(currentList));

            document.getElementById('watch-input-code').value = '';
            document.getElementById('watch-input-name').value = '';

            alert(`✅ 已成功新增 ${code}！即將刷新頁面並觸發背景爬蟲抓取最新圖表數據...`);
            location.reload();
        }

        // 🗑️ 真實刪除股票
        function removeWatchlist(code) {
            if(!confirm(`確定要刪除 ${code} 嗎？`)) return;

            let currentList = JSON.parse(localStorage.getItem('my_watchlist') || '[]');
            currentList = currentList.filter(s => s.code !== code);
            localStorage.setItem('my_watchlist', JSON.stringify(currentList));

            alert(`已刪除 ${code}！`);
            location.reload();
        }

        // 讀取 JSON 並渲染頁面
        fetch('./data.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('last-update-time').innerText = '更新於 ' + data.last_updated;

                if (data.watchlist && data.watchlist.length > 0) {
                    globalStockData = data.watchlist;
                    renderWatchlistTable(globalStockData);
                    // 預設渲染第一隻股票的圖表
                    renderStockChart(globalStockData[0]);
                }
            })
            .catch(err => console.error("Data fetch error:", err));
    </script>
</body>
</html>
