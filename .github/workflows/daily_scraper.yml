name: Daily Scraper & Build

on:
  schedule:
    - cron: '0 16 * * *' # 每天自動執行
  workflow_dispatch: # 👈 就是這行！必須存在才會出現 Run workflow 按鈕

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Data Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data" && git push)
