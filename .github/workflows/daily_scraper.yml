name: Secure Auto Scraper Workflow

on:
  schedule:
    - cron: '0 0 * * *'  # 每日定時執行
  workflow_dispatch:     # ⚠️ 必須有這行，GitHub 才會顯示 Run workflow 按鈕！

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas yfinance

      - name: 4. 執行爬蟲腳本
        run: python scraper.py

      - name: 5. 提交並推送新數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Auto update data.json" || exit 0
          git push
