name: Secure Auto Scraper Workflow

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (香港時間 08:00) 自動執行
  workflow_dispatch: # 支援手動按下按鈕測試執行

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    # 🔒 SECURITY CHECKPOINT: 嚴格控制機器人權限，僅給予寫入代碼庫的最低權限
    permissions:
      contents: write

    steps:
    - name: 1. 檢出程式碼 (Checkout Repo)
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

- name: 3. 安裝必要套件
       run: |
         python -m pip install --upgrade pip
         pip install requests beautifulsoup4 pandas yfinance

    - name: 4. 執行 Python 爬蟲 (注入安全金鑰)
      # 🔒 SECURITY CHECKPOINT: 從 GitHub Secrets 安全傳遞金鑰至 Python 環境變數
      env:
        MY_API_SECRET: ${{ secrets.API_SECRET_KEY }}
      run: python scraper.py

    - name: 5. 自動 Commit 並安全 Update data.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Security Bot"
        git add data.json
        git diff-index --quiet HEAD || (git commit -m "Auto-update data.json [skip ci]" && git push)
